    intro: "자신의 영역과 원칙을 중요하게 여기고, 공동체의 규범을 지키는 성향이 동예와 닮았어. 선을 넘지 않는 관계와 질서 있는 사회를 편하게 느끼는 타입이야.",
    traits: [
      "한반도 동해안 지역 — 왕 없이 읍군·삼로라 불리는 군장이 통치",
      "책화: 다른 부족의 영역을 침범하면 노비·소·말로 배상",
      "족외혼: 같은 씨족끼리는 혼인 금지",
      "특산물: 단궁(박달나무 활), 과하마, 반어피",
      "10월 무천: 하늘에 제사를 지내는 제천 행사",
    ],
    compare: [["정치","군장 사회, 왕 없음, 읍군·삼로 통치"],["경제","농사 발달, 해산물·소금 풍부, 특산물 교역"],["사회","책화(영역 침범 배상), 족외혼"],["풍속","무천(10월 제천), 산천 경계 중시"]],
    think: "동예의 책화는 현대의 어떤 개념과 연결될 수 있을까? <strong>국제법의 영토 침범 배상 원칙</strong>이나 민사 손해배상과 비교해봐.",
  },
  옥저: {
    emoji: "🏡", colorClass: "color-navy", bgClass: "bg-navy", barColor: "#1a3a5c",
    keywords: ["민며느리제", "가족 공동 무덤", "예속 사회"],
    intro: "가족과 공동체를 소중히 여기고, 갈등보다 조화를 선택하는 성향이 옥저와 닮았어. 생활의 실제 모습과 사람 사이의 관계를 중요하게 보는 타입이야.",
    traits: [
      "한반도 동해안 북쪽 — 읍군·삼로라 불리는 군장이 통치",
      "고구려의 지배를 받아 강한 독립 국가로 성장하지 못함",
      "민며느리제: 약혼한 여자아이를 신랑 집에서 키운 후 혼인",
      "가족 공동 무덤: 뼈를 따로 보관했다가 큰 나무 상자에 합장",
      "농사에 적합한 땅 + 해산물·소금 풍부",
    ],
    compare: [["정치","군장 사회, 고구려에 예속"],["경제","농사·해산물 발달, 고구려에 특산물 공납"],["사회","민며느리제, 가족 공동 무덤"],["풍속","공동체 중심의 생활 방식"]],
    think: "옥저가 고구려에 예속된 이유는 지리적 고립 때문이야. <strong>지리 환경이 한 나라의 운명을 어떻게 결정할 수 있을까?</strong> 다른 나라들과 비교해봐.",
  },
};

const TOTAL = questions.length;
let current = 0;
let scores = { 고구려: 0, 부여: 0, 삼한: 0, 동예: 0, 옥저: 0 };
let selected = null;

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-number').textContent = `Question ${String(current+1).padStart(2,'0')}`;
  document.getElementById('q-text').textContent = q.text;
  const pct = Math.round((current + 1) / TOTAL * 100);
  document.getElementById('progress-text').textContent = `질문 ${current+1} / ${TOTAL}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  ['A','B','C'].forEach((letter, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${letter}</span><span>${q.options[i].text}</span>`;
    btn.onclick = () => selectOption(i, btn);
    optionsEl.appendChild(btn);
  });

  selected = null;
  document.getElementById('next-btn').style.display = 'none';
  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'slideIn 0.35s ease';
}

function selectOption(idx, btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selected = idx;
  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
  if (selected === null) return;
  scores[questions[current].options[selected].nation]++;
  current++;
  if (current < TOTAL) { renderQuestion(); } else { showResult(); }
}

function showResult() {
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const topScore = sorted[0][1];
  const topCandidates = sorted.filter(([,v]) => v === topScore).map(([k]) => k);
  const priority = ["고구려","부여","삼한","동예","옥저"];
  const winner = priority.find(p => topCandidates.includes(p));
  const d = nationData[winner];
  const maxScore = Math.max(...Object.values(scores), 1);

  document.getElementById('quiz-section').style.display = 'none';

  const scoreRows = sorted.map(([nation, score]) => `
    <div class="score-row">
      <span class="score-nation">${nation}</span>
      <div class="score-bar-wrap">
        <div class="score-bar-fill" style="width:${Math.round(score/maxScore*100)}%;background:${nationData[nation].barColor};"></div>
      </div>
      <span class="score-num">${score}점</span>
    </div>`).join('');

  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  rc.innerHTML = `
    <div class="result-badge">
      <span class="emoji">${d.emoji}</span>
      <h2>당신의 고대 국가는</h2>
      <h3 class="${d.colorClass}">${winner}</h3>
      <div>${d.keywords.map(k=>`<span class="keyword ${d.bgClass}">${k}</span>`).join('')}</div>
    </div>
    <div class="result-section">
      <h4>🧭 캐릭터 해석</h4>
      <p>${d.intro}</p>
    </div>
    <div class="result-section">
      <h4>📋 ${winner}의 특징</h4>
      <ul class="trait-list">${d.traits.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>
    <div class="result-section">
      <h4>🗂 정치·경제·사회·풍속 정리</h4>
      <table class="compare-table"><tbody>
        ${d.compare.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="result-section">
      <h4>💭 생각해볼 질문</h4>
      <div class="think-box"><p>${d.think}</p></div>
    </div>
    <div class="result-section">
      <h4>📊 점수 분포</h4>
      <div class="score-rows">${scoreRows}</div>
    </div>
    <div class="card-hint">📌 수업 시간에 <strong>같은 나라가 나온 친구들끼리 모여</strong> 상황 카드를 풀어보자!</div>
    <button class="retry-btn" onclick="restart()">🔄 다시 테스트하기</button>
  `;
}

function restart() {
  current = 0;
  scores = { 고구려:0, 부여:0, 삼한:0, 동예:0, 옥저:0 };
  selected = null;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
